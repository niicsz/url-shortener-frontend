services:
  frontend:
    build: .
    container_name: url-shortener-frontend
    ports:
      - "4200:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8080}
      SHORT_BASE_URL: ${SHORT_BASE_URL:-http://localhost:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
